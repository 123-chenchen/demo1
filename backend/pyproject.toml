[project]
name = "pdf-chatbot"
version = "0.1.0"
description = "Backend bootstrap for a PDF chatbot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.18.4",
    "bcrypt>=5.0.0",
    "fastapi>=0.135.3",
    "httpx>=0.28.1",
    "langchain>=1.2.15",
    "langchain-google-genai>=4.2.1",
    "langchain-huggingface>=0.3.1",
    "langchain-ollama>=1.1.0",
    "langchain-qdrant>=0.2.1",
    "langchain-text-splitters>=1.1.1",
    "loguru>=0.7.3",
    "minio>=7.2.20",
    "ollama>=0.6.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "psycopg[binary]>=3.2.10",
    "pyjwt>=2.12.1",
    "pypdf>=6.9.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.24",
    "qdrant-client>=1.17.1",
    "sentence-transformers>=5.1.2",
    "sqlalchemy>=2.0.49",
    "tiktoken>=0.12.0",
    "uvicorn[standard]>=0.44.0",
]

[project.scripts]
pdf-chatbot = "app.main:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires live backend services, database, Qdrant, and a configured LLM",
]
